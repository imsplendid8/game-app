name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/kimnep-game-spec-vhhil3
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 데이터 무결성/게임 규칙 테스트가 통과해야 배포한다
      - run: npm test

      - run: npm run build
        env:
          # 프로젝트 페이지 하위 경로 (https://imsplendid8.github.io/game-app)
          NEXT_PUBLIC_BASE_PATH: /game-app

      # GitHub Pages가 _next 폴더를 무시하지 않도록
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
